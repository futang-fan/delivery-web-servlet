<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理 - 在线外卖点餐与配送调度平台</title>
    <link rel="preload" href="../libs/vue.esm-browser.prod.js" as="script" crossorigin>
    <link rel="preload" href="../common/common.js" as="script" crossorigin>
    <link rel="stylesheet" href="../common/style.css">
</head>
<body>
<div id="app" v-cloak class="shell admin-layout">
    <app-sidenav :user="user" active-href="merchant-orders.html" brand="商家中心" logo="店"></app-sidenav>
    <div class="admin-main">
    <app-topbar :user="user" :show-nav="false" brand="订单管理"></app-topbar>
    <main class="page">
        <section class="card">
            <div class="brand">
                <div class="logo">单</div>
                <h1>订单管理</h1>
                <p>接单 · 拒单 · 备餐完成 · 本店订单查询</p>
            </div>

            <div v-if="notice" :class="['notice', noticeType]">{{ notice }}</div>

            <div class="tabs">
                <button :class="{ active: tab === 'orders' }" type="button" @click="switchTab('orders')">订单管理</button>
                <button :class="{ active: tab === 'refunds' }" type="button" @click="switchTab('refunds')">
                    退款处理<span v-if="refundTotal > 0">（{{ refundTotal }}）</span>
                </button>
            </div>

            <template v-if="tab === 'orders'">
            <div class="toolbar">
                <select id="status-filter" v-model="statusFilter" @change="search">
                    <option value="">全部状态</option>
                    <option value="UNPAID">待支付</option>
                    <option value="PENDING_ACCEPT">待商家处理</option>
                    <option value="PREPARING">备餐中</option>
                    <option value="PENDING_DELIVERY">待配送</option>
                    <option value="DELIVERING">配送中</option>
                    <option value="DELIVERED">已送达</option>
                    <option value="COMPLETED">已完成</option>
                    <option value="CANCELLED">已取消</option>
                    <option value="REJECTED">已拒单</option>
                </select>
                <span>共 {{ total }} 单</span>
            </div>

            <div class="table-wrap">
                <table class="table">
                    <thead>
                    <tr>
                        <th>订单号</th><th>取餐码</th><th>收货地址快照</th><th>实付金额</th>
                        <th>支付状态</th><th>订单状态</th><th>下单时间</th><th>操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- template v-for 包裹主行+详情行：详情行需复用 o 的作用域 -->
                    <template v-for="o in orders" :key="o.id">
                    <tr>
                        <td>{{ o.orderNo }}</td>
                        <!-- A3 取餐码：订单号后四位大字，出餐/交接时供骑手口头核对 -->
                        <td>
                            <span class="pickup-code">
                                <span class="pickup-code-label">取餐码</span>
                                <b>{{ codeOf(o.orderNo) }}</b>
                            </span>
                        </td>
                        <td>{{ o.addressSnapshot }}</td>
                        <td>¥{{ Number(o.payAmount).toFixed(2) }}</td>
                        <td>
                            <span class="badge" :class="{ success: o.payStatus === 'PAID' }">{{ payText(o) }}</span>
                        </td>
                        <td>
                            <span class="badge" :class="statusClass(o)">{{ statusText(o) }}</span>
                        </td>
                        <td :title="o.createdAt">
                            <div class="cell-date">{{ datePart(o.createdAt) }}</div>
                            <div class="tip">{{ timePart(o.createdAt) }}</div>
                        </td>
                        <td>
                            <div class="row-actions">
                                <a class="btn" :href="'order-detail.html?orderId=' + o.id">详情页</a>
                                <button class="btn" type="button" @click="toggleDetail(o)" :disabled="loading">
                                    {{ detail && detail.order.id === o.id ? '收起' : '详情' }}
                                </button>
                                <template v-if="o.orderStatus === 'PENDING_ACCEPT'">
                                    <button class="btn primary" type="button" @click="accept(o)" :disabled="loading">接单</button>
                                    <button class="btn danger" type="button" @click="startReject(o)" :disabled="loading">拒单</button>
                                </template>
                                <template v-else-if="o.orderStatus === 'PREPARING'">
                                    <button class="btn primary" type="button" @click="ready(o)" :disabled="loading">备餐完成</button>
                                </template>
                            </div>
                        </td>
                    </tr>
                    <!-- 展开详情行：详情在被点击行正下方就地展开，避免跳到页底 -->
                    <tr v-if="detail && detail.order.id === o.id" class="detail-row">
                        <td colspan="8">
                            <div class="panel">
                                <div class="detail-summary">
                                    <div><span class="detail-label">收货地址</span><span>{{ detail.order.addressSnapshot }}</span></div>
                                    <div><span class="detail-label">备注</span><span>{{ detail.order.remark || '无' }}</span></div>
                                </div>
                                <div class="table-wrap">
                                    <table class="table">
                                        <thead>
                                        <tr><th>菜品</th><th>单价快照</th><th>数量</th><th>小计</th></tr>
                                        </thead>
                                        <tbody>
                                        <tr v-for="it in detail.items" :key="it.id">
                                            <td>{{ it.dishNameSnapshot }}</td>
                                            <td>¥{{ Number(it.priceSnapshot).toFixed(2) }}</td>
                                            <td>{{ it.quantity }}</td>
                                            <td>¥{{ Number(it.subtotal).toFixed(2) }}</td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <div class="detail-summary detail-summary-footer">
                                    <div><span class="detail-label">总金额</span><span>¥{{ Number(detail.order.totalAmount).toFixed(2) }}</span></div>
                                    <div><span class="detail-label">实付</span><span>¥{{ Number(detail.order.payAmount).toFixed(2) }}</span></div>
                                    <div><span class="detail-label">配送记录</span><span>{{ detail.delivery ? detail.delivery.status : '未生成' }}</span></div>
                                    <div><span class="detail-label">退款记录</span><span>{{ detail.refund ? detail.refund.status : '无' }}</span></div>
                                </div>
                            </div>
                        </td>
                    </tr>
                    <!-- 拒单原因行：在被点击订单行正下方就地展开（与详情同主从范式） -->
                    <tr v-if="reject.id === o.id" class="detail-row">
                        <td colspan="8">
                            <div class="panel">
                                <div class="panel-header">
                                    <strong>正在拒单「{{ o.orderNo }}」</strong>
                                    <button class="btn" type="button" @click="cancelReject" :disabled="loading">取消</button>
                                </div>
                                <div class="field">
                                    <label :for="'reject-reason-' + o.id">拒单原因</label>
                                    <textarea :id="'reject-reason-' + o.id" v-model.trim="reject.reason" maxlength="200"
                                              placeholder="请填写拒单原因（必填）"></textarea>
                                </div>
                                <div class="form-actions">
                                    <button class="btn danger" type="button" @click="confirmReject" :disabled="loading">确认拒单</button>
                                </div>
                            </div>
                        </td>
                    </tr>
                    </template>
                    <tr v-if="!loading && orders.length === 0">
                        <td colspan="8"><div class="empty">没有符合条件的订单</div></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- 拒单原因已行内化至被点击订单行下方，无页底确认区 -->

            <div class="pager" v-if="total > 0">
                <button class="btn" type="button" @click="turn(page - 1)" :disabled="page <= 1 || loading">上一页</button>
                <span>第 {{ page }} / {{ pages }} 页</span>
                <button class="btn" type="button" @click="turn(page + 1)" :disabled="page >= pages || loading">下一页</button>
            </div>
            </template>

            <!-- 退款处理页签：本店待处理退款 + 同意/拒绝确认面板 -->
            <template v-if="tab === 'refunds'">
                <div class="toolbar">
                    <span>{{ refundTotal }} 笔待处理退款</span>
                    <button class="btn" type="button" @click="loadRefunds" :disabled="loading">刷新</button>
                </div>

                <div class="table-wrap">
                    <table class="table">
                        <thead>
                        <tr><th>订单号</th><th>实付金额</th><th>退款原因</th><th>申请时间</th><th>操作</th></tr>
                        </thead>
                        <tbody>
                        <!-- template v-for 包裹主行+处理行：处理面板在被点击行正下方就地展开（与订单详情同主从范式） -->
                        <template v-for="r in refunds" :key="r.refundId">
                        <tr>
                            <td>{{ r.orderNo }}</td>
                            <td>¥{{ Number(r.payAmount).toFixed(2) }}</td>
                            <td><span class="cell-clip" :title="r.reason">{{ r.reason }}</span></td>
                            <td :title="r.createdAt">
                                <div class="cell-date">{{ datePart(r.createdAt) }}</div>
                                <div class="tip">{{ timePart(r.createdAt) }}</div>
                            </td>
                            <td>
                                <button class="btn primary" type="button" @click="startHandle(r)" :disabled="loading">
                                    {{ handling && handling.refundId === r.refundId ? '收起' : '处理' }}
                                </button>
                            </td>
                        </tr>
                        <!-- 处理确认行：处理说明 + 同意/拒绝 -->
                        <tr v-if="handling && handling.refundId === r.refundId" class="detail-row">
                            <td colspan="5">
                                <div class="panel">
                                    <div class="panel-header">
                                        <strong>处理退款「{{ handling.orderNo }}」</strong>
                                        <button class="btn" type="button" @click="cancelHandle" :disabled="loading">取消</button>
                                    </div>
                                    <div class="tip">
                                        顾客原因：{{ handling.reason }} · 全额退款 ¥{{ Number(handling.payAmount).toFixed(2) }}；
                                        同意后订单支付状态置为已退款
                                    </div>
                                    <div class="field">
                                        <label for="handle-remark">处理说明</label>
                                        <textarea id="handle-remark" v-model.trim="handleRemark" maxlength="200"
                                                  placeholder="选填，如：已同意退款，将原路退回"></textarea>
                                    </div>
                                    <div class="form-actions">
                                        <button class="btn primary" type="button" @click="confirmHandle(true)" :disabled="loading">同意退款</button>
                                        <button class="btn danger" type="button" @click="confirmHandle(false)" :disabled="loading">拒绝退款</button>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        </template>
                        <tr v-if="!loading && refunds.length === 0">
                            <td colspan="5"><div class="empty">没有待处理的退款申请</div></td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="pager" v-if="refundTotal > 0">
                    <button class="btn" type="button" @click="turnRefund(refundPage - 1)" :disabled="refundPage <= 1 || loading">上一页</button>
                    <span>第 {{ refundPage }} / {{ refundPages }} 页</span>
                    <button class="btn" type="button" @click="turnRefund(refundPage + 1)" :disabled="refundPage >= refundPages || loading">下一页</button>
                </div>
            </template>

            <div class="footer">DeliveryWeb</div>
        </section>
    </main>
    </div>
</div>

<script type="module">
    import { createApp } from '../libs/vue.esm-browser.prod.js';
    import { installShell, get, post, label, ORDER_STATUS_TEXT, PAY_STATUS_TEXT, requireRole, pickupCode } from '../common/common.js';

    const app = createApp({
        data() {
            return {
                statusFilter: '',
                orders: [],
                page: 1,
                size: 10,
                total: 0,
                pages: 0,
                loading: true,
                notice: '',
                noticeType: 'error',
                reject: { id: null, orderNo: '', reason: '' },
                detail: null,
                tab: 'orders',
                refunds: [],
                refundPage: 1,
                refundTotal: 0,
                refundPages: 0,
                handling: null,
                handleRemark: '',
                user: null
            };
        },
        methods: {
            showError(m) { this.noticeType = 'error'; this.notice = m; },
            showSuccess(m) { this.noticeType = 'success'; this.notice = m; },
            statusText(o) { return label(ORDER_STATUS_TEXT, o.orderStatus); },
            payText(o) { return label(PAY_STATUS_TEXT, o.payStatus); },
            datePart(s) { return s ? s.split(' ')[0] : '—'; },
            timePart(s) { const t = s ? s.split(' ')[1] : ''; return t ? t.slice(0, 5) : ''; },
            codeOf(orderNo) { return pickupCode(orderNo); },
            statusClass(o) {
                if (o.orderStatus === 'COMPLETED' || o.orderStatus === 'DELIVERED') return 'success';
                if (o.orderStatus === 'CANCELLED' || o.orderStatus === 'REJECTED') return 'error';
                return '';
            },
            async load() {
                this.loading = true;
                this.notice = '';
                this.detail = null;
                try {
                    const params = new URLSearchParams();
                    params.set('page', this.page);
                    params.set('size', this.size);
                    if (this.statusFilter) params.set('status', this.statusFilter);
                    const result = await get('/api/order/list?' + params.toString());
                    const data = (result && result.data) || {};
                    this.orders = data.records || [];
                    this.total = Number(data.total) || 0;
                    this.pages = Number(data.pages) || 0;
                } catch (e) {
                    this.showError(e.message || '加载失败');
                } finally {
                    this.loading = false;
                }
            },
            search() {
                this.page = 1;
                this.load();
            },
            turn(page) {
                this.page = page;
                this.load();
            },
            async accept(order) {
                // 接单后拒单已不可能，收起可能残留的行内拒单面板
                this.cancelReject();
                this.loading = true;
                try {
                    await post('/api/order/accept', { orderId: order.id });
                    await this.load();
                    this.showSuccess('已接单「' + order.orderNo + '」');
                } catch (e) {
                    this.showError(e.message || '接单失败');
                } finally {
                    this.loading = false;
                }
            },
            startReject(order) {
                // 同行再点收起，与详情切换行为一致
                if (this.reject.id === order.id) {
                    this.cancelReject();
                    return;
                }
                this.reject = { id: order.id, orderNo: order.orderNo, reason: '' };
            },
            cancelReject() {
                this.reject = { id: null, orderNo: '', reason: '' };
            },
            async confirmReject() {
                if (!this.reject.reason) {
                    this.showError('请填写拒单原因');
                    return;
                }
                this.loading = true;
                const orderNo = this.reject.orderNo;
                try {
                    await post('/api/order/reject', { orderId: this.reject.id, reason: this.reject.reason });
                    this.cancelReject();
                    await this.load();
                    this.showSuccess('已拒单「' + orderNo + '」，已生成退款记录');
                } catch (e) {
                    this.showError(e.message || '拒单失败');
                } finally {
                    this.loading = false;
                }
            },
            async ready(order) {
                this.cancelReject();
                this.loading = true;
                try {
                    await post('/api/order/ready', { orderId: order.id });
                    await this.load();
                    this.showSuccess('备餐完成「' + order.orderNo + '」，已进入配送池');
                } catch (e) {
                    this.showError(e.message || '操作失败');
                } finally {
                    this.loading = false;
                }
            },
            async toggleDetail(order) {
                if (this.detail && this.detail.order.id === order.id) {
                    this.detail = null;
                    return;
                }
                this.loading = true;
                try {
                    const result = await get('/api/order/detail?orderId=' + order.id);
                    this.detail = (result && result.data) || null;
                } catch (e) {
                    this.showError(e.message || '加载详情失败');
                } finally {
                    this.loading = false;
                }
            },
            switchTab(tab) {
                if (this.tab === tab) {
                    return;
                }
                this.tab = tab;
                if (tab === 'refunds') {
                    this.refundPage = 1;
                    this.loadRefunds();
                } else {
                    this.page = 1;
                    this.load();
                }
            },
            async loadRefunds() {
                this.loading = true;
                this.notice = '';
                this.handling = null;
                try {
                    const result = await get('/api/refund/pending?page=' + this.refundPage + '&size=' + this.size);
                    const data = (result && result.data) || {};
                    this.refunds = data.records || [];
                    this.refundTotal = Number(data.total) || 0;
                    this.refundPages = Number(data.pages) || 0;
                } catch (e) {
                    this.showError(e.message || '加载退款列表失败');
                } finally {
                    this.loading = false;
                }
            },
            turnRefund(page) {
                this.refundPage = page;
                this.loadRefunds();
            },
            startHandle(refund) {
                // 同行再点收起，与订单详情切换行为一致
                if (this.handling && this.handling.refundId === refund.refundId) {
                    this.cancelHandle();
                    return;
                }
                this.handling = refund;
                this.handleRemark = '';
            },
            cancelHandle() {
                this.handling = null;
                this.handleRemark = '';
            },
            async confirmHandle(agree) {
                this.loading = true;
                const orderNo = this.handling.orderNo;
                const refundId = this.handling.refundId;
                try {
                    await post('/api/refund/handle', { refundId, agree, remark: this.handleRemark });
                    this.cancelHandle();
                    await this.loadRefunds();
                    this.showSuccess(agree ? '已同意退款「' + orderNo + '」，订单置为已退款'
                            : '已拒绝退款「' + orderNo + '」');
                } catch (e) {
                    this.showError(e.message || '退款处理失败');
                } finally {
                    this.loading = false;
                }
            }
        },
        async mounted() {
            const user = await requireRole('SHOP');
            if (!user) return;
            this.user = user;
            this.load();
            this.loadRefunds();
        }
    });
    installShell(app);
    app.mount('#app');
</script>
</body>
</html>
