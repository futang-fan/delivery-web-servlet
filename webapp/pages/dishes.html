<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菜品管理 - 在线外卖点餐与配送调度平台</title>
    <link rel="preload" href="../libs/vue.esm-browser.prod.js" as="script" crossorigin>
    <link rel="preload" href="../common/common.js" as="script" crossorigin>
    <link rel="stylesheet" href="../common/style.css">
</head>
<body>
<div id="app" v-cloak class="shell admin-layout">
    <app-sidenav :user="user" active-href="dishes.html" brand="商家中心" logo="店"></app-sidenav>
    <div class="admin-main">
    <app-topbar :user="user" :show-nav="false" brand="菜品管理"></app-topbar>
    <main class="page">
        <section class="card">
            <div class="brand">
                <div class="logo">菜</div>
                <h1>菜品管理</h1>
                <p>新增、编辑、上下架与库存维护</p>
            </div>

            <div v-if="notice" :class="['notice', noticeType]">{{ notice }}</div>

            <div v-if="!approved" class="notice error">店铺未通过审核，暂不能管理菜品。</div>

            <template v-else>
                <div class="toolbar">
                    <span>共 {{ dishes.length }} 道菜</span>
                    <span class="tip">新品保存后默认为下架，需手动上架</span>
                    <button class="btn primary" type="button" @click="openForm()" :disabled="loading">新增菜品</button>
                </div>
                <!-- 低库存预警图例：独立一行，避免桌面端 toolbar 不换行时被长文本挤变形 -->
                <div class="tip">库存低于 {{ lowStockThreshold }} 的菜品整行高亮预警；库存为 0 时顾客端显示已售罄并禁用加购</div>

                <form v-if="showForm" novalidate @submit.prevent="save" class="panel">
                    <div class="panel-header">
                        <strong>{{ form.id ? '编辑菜品' : '新增菜品' }}</strong>
                        <button class="btn" type="button" @click="closeForm" :disabled="loading">关闭</button>
                    </div>
                    <div class="field">
                        <label for="d-name">菜品名称</label>
                        <input id="d-name" v-model.trim="form.name" type="text" maxlength="50" placeholder="1-50 个字符，同店唯一">
                    </div>
                    <div class="field">
                        <label for="d-price">价格（元）</label>
                        <input id="d-price" v-model.trim="form.price" type="number" step="0.01" min="0.01" placeholder="正数，最多两位小数">
                    </div>
                    <div class="field">
                        <label for="d-stock">库存数量</label>
                        <input id="d-stock" v-model.trim="form.stock" type="number" step="1" min="0" placeholder="非负整数">
                    </div>
                    <div class="field">
                        <label for="d-image">图片地址（可选）</label>
                        <input id="d-image" v-model.trim="form.imageUrl" type="text" maxlength="200" placeholder="https://...">
                    </div>
                    <div class="field">
                        <label for="d-description">菜品描述（可选）</label>
                        <textarea id="d-description" v-model.trim="form.description" maxlength="200" placeholder="200 字以内"></textarea>
                    </div>
                    <div class="form-actions">
                        <button class="submit" type="submit" :disabled="loading">{{ loading ? '保存中…' : '保存' }}</button>
                        <button class="btn" type="button" @click="closeForm" :disabled="loading">取消</button>
                    </div>
                </form>

                <div class="table-wrap">
                <table class="table">
                    <thead>
                    <tr><th>名称</th><th>价格</th><th>库存</th><th>状态</th><th>操作</th></tr>
                    </thead>
                    <tbody>
                    <!-- 低库存预警：库存 < 阈值（含售罄）的菜品整行高亮，提醒商家及时补货 -->
                    <tr v-for="d in dishes" :key="d.id" :class="{ 'row-low-stock': isLowStock(d) }">
                        <td>
                            {{ d.name }}
                            <div class="tip">{{ d.description || '' }}</div>
                        </td>
                        <td>¥{{ Number(d.price).toFixed(2) }}</td>
                        <td>
                            {{ d.stock }}
                            <span v-if="stockOf(d) === 'SOLD_OUT'" class="badge error">售罄</span>
                            <span v-else-if="stockOf(d) === 'LOW'" class="badge warn">库存告急</span>
                        </td>
                        <td>
                            <span class="badge" :class="{ success: d.status === 'ON_SALE' }">
                                {{ d.status === 'ON_SALE' ? '已上架' : '已下架' }}
                            </span>
                        </td>
                        <td>
                            <button class="btn" type="button" @click="openForm(d)" :disabled="loading">编辑</button>
                            <button class="btn" type="button"
                                    :class="{ primary: d.status === 'OFF_SALE' }"
                                    @click="toggle(d)" :disabled="loading">
                                {{ d.status === 'ON_SALE' ? '下架' : '上架' }}
                            </button>
                        </td>
                    </tr>
                    <tr v-if="!loading && dishes.length === 0">
                        <td colspan="5"><div class="empty">还没有菜品，点击“新增菜品”添加</div></td>
                    </tr>
                    </tbody>
                </table>
                </div>
            </template>

            <div class="footer">DeliveryWeb</div>
        </section>
    </main>
    </div>
</div>

<script type="module">
    import { createApp } from '../libs/vue.esm-browser.prod.js';
    import { installShell, get, post, requireRole, stockState, LOW_STOCK_THRESHOLD } from '../common/common.js';

    const app = createApp({
        data() {
            return {
                approved: true,
                dishes: [],
                loading: true,
                notice: '',
                noticeType: 'error',
                showForm: false,
                form: { id: null, name: '', price: '', stock: '', imageUrl: '', description: '' },
                lowStockThreshold: LOW_STOCK_THRESHOLD,
                user: null
            };
        },
        methods: {
            showError(m) { this.noticeType = 'error'; this.notice = m; },
            showSuccess(m) { this.noticeType = 'success'; this.notice = m; },
            /** 库存状态：SOLD_OUT / LOW / OK */
            stockOf(dish) { return stockState(dish.stock); },
            /** 是否需预警（库存低于阈值，含售罄） */
            isLowStock(dish) { return stockState(dish.stock) !== 'OK'; },
            async load() {
                this.loading = true;
                this.notice = '';
                try {
                    const result = await get('/api/dish/my');
                    this.dishes = (result && result.data) || [];
                } catch (e) {
                    this.showError(e.message || '加载失败');
                    if (/未通过审核/.test(e.message)) this.approved = false;
                } finally {
                    this.loading = false;
                }
            },
            openForm(dish) {
                if (dish) {
                    this.form = {
                        id: dish.id, name: dish.name,
                        price: dish.price != null ? Number(dish.price) : '',
                        stock: dish.stock, imageUrl: dish.imageUrl || '',
                        description: dish.description || ''
                    };
                } else {
                    this.form = { id: null, name: '', price: '', stock: '', imageUrl: '', description: '' };
                }
                this.showForm = true;
                this.notice = '';
            },
            closeForm() {
                this.showForm = false;
                this.notice = '';
            },
            async save() {
                const f = this.form;
                if (!f.name) { this.showError('请填写菜品名称'); return; }
                if (!f.price || Number(f.price) <= 0) { this.showError('价格须为正数'); return; }
                const stockNum = Number(f.stock);
                if (f.stock === '' || f.stock === null || !Number.isInteger(stockNum) || stockNum < 0) {
                    this.showError('库存须为非负整数');
                    return;
                }
                this.loading = true;
                try {
                    await post('/api/dish/save', {
                        id: f.id || null,
                        name: f.name,
                        price: Number(f.price),
                        stock: Number(f.stock),
                        imageUrl: f.imageUrl || null,
                        description: f.description || null
                    });
                    this.closeForm();
                    await this.load();
                    this.showSuccess('保存成功');
                } catch (e) {
                    this.showError(e.message || '保存失败');
                } finally {
                    this.loading = false;
                }
            },
            async toggle(dish) {
                this.loading = true;
                try {
                    const status = dish.status === 'ON_SALE' ? 'OFF_SALE' : 'ON_SALE';
                    await post('/api/dish/status', { id: dish.id, status });
                    await this.load();
                    this.showSuccess(status === 'ON_SALE' ? '已上架' : '已下架');
                } catch (e) {
                    this.showError(e.message || '操作失败');
                } finally {
                    this.loading = false;
                }
            }
        },
        async mounted() {
            const user = await requireRole('SHOP');
            if (!user) return;
            this.user = user;
            this.load();
        }
    });
    installShell(app);
    app.mount('#app');
</script>
</body>
</html>
